<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>흥부놀부 생방송 안내</title>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FKCGQT5R6X"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-FKCGQT5R6X');

    function trackClick(eventName, buttonName, linkUrl) {
      gtag('event', eventName, {
        event_category: 'landing_button',
        button_name: buttonName,
        link_url: linkUrl,
        transport_type: 'beacon'
      });
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .wrapper {
      position: relative;
      width: 100%;
      max-width: 891px;
      margin: 0 auto;
      overflow: hidden;
      background: #000;
    }

    @media (min-width: 900px) {
      .wrapper {
        width: 45%;
        max-width: 720px;
      }
    }

    /* 랜딩 이미지 */
    .wrapper img {
      display: block;
      width: calc(100% + 2px);
      max-width: none;
      height: auto;
      margin-left: -1px;
    }

    /* 클릭 영역 공통 */
    .click-zone {
      position: absolute;
      left: 9.5%;
      width: 81%;
      display: block;
      cursor: pointer;
      z-index: 10;
    }

    /* 1. 지금 생방송 보기 */
    .zone1 {
      top: 54.2%;
      height: 8.9%;
    }

    /* 2. 지난 방송 다시보기 */
    .zone2 {
      top: 64.1%;
      height: 8.9%;
    }

    /* 3. 오늘의 방송 일정 */
    .zone3 {
      top: 73.9%;
      height: 8.9%;
    }

    /* 4. 커뮤니티 문의 */
    .zone4 {
      top: 83.8%;
      height: 8.9%;
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <!-- 랜딩 이미지 -->
    <img
      src="./landing.png"
      alt="흥부놀부 생방송 안내 페이지"
    />

    <!-- 1. 지금 생방송 보기 -->
    <a
      class="click-zone zone1"
      href="https://xn--or3b21d71b.tv/%ED%9D%A5%EB%B6%80%EB%86%80%EB%B6%80"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="지금 생방송 보기"
      onclick="trackClick(
        'live_click',
        '지금 생방송 보기',
        this.href
      )">
    </a>

    <!-- 2. 지난 방송 다시보기 -->
    <a
      class="click-zone zone2"
      href="https://www.youtube.com/@%EC%98%A4%EB%A3%A1%EC%9D%B4%EB%B6%80%EB%B6%802/featured"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="지난 방송 다시보기"
      onclick="trackClick(
        'replay_click',
        '지난 방송 다시보기',
        this.href
      )">
    </a>

    <!-- 3. 오늘의 방송 일정 -->
    <a
      class="click-zone zone3"
      href="https://open.kakao.com/o/snejV3lg"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="오늘의 방송 일정"
      onclick="trackClick(
        'schedule_click',
        '오늘의 방송 일정',
        this.href
      )">
    </a>

    <!-- 4. 커뮤니티 문의 -->
    <a
      class="click-zone zone4"
      href="https://telegram.me/storyinquiry"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="커뮤니티 문의"
      onclick="trackClick(
        'community_click',
        '커뮤니티 문의',
        this.href
      )">
    </a>

  </div>

</body>
</html>
